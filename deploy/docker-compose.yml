# DSH Bot web on a server: docker compose up -d --build (run from the repository root
# copy, with .env beside this file: DSH_BOT_PASSWORD and the model provider keys).
services:
  dsh-bot:
    build: { context: .., dockerfile: Dockerfile }
    image: dsh-bot-web:latest
    container_name: dsh-bot-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "8290:8290"
    volumes:
      - ./data:/data
    # Docker's default seccomp profile blocks the user namespaces bubblewrap needs; DSH
    # then confines the Bots' commands with Landlock instead. No extra privileges.
