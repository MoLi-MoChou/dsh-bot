# Mochou web on a server: docker compose up -d --build (run from the repository root
# copy, with .env beside this file: MOCHOU_PASSWORD and the model provider keys).
services:
  mochou:
    build: { context: .., dockerfile: Dockerfile }
    image: mochou:latest
    container_name: mochou
    restart: unless-stopped
    env_file: .env
    ports:
      - "8290:8290"
    volumes:
      - ./data:/data
    # Docker's default seccomp profile blocks the user namespaces bubblewrap needs; DSH
    # then confines the Bots' commands with Landlock instead. No extra privileges.
