# Moon Bot web on a server: docker compose up -d --build (run from the repository root
# copy, with .env beside this file: MOON_BOT_PASSWORD and the model provider keys).
services:
  moon-bot:
    build: { context: .., dockerfile: Dockerfile }
    image: moon-bot:latest
    container_name: moon-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8290:8290"
    volumes:
      - ./data:/data
    # Docker's default seccomp profile blocks the user namespaces bubblewrap needs; DSH
    # then confines the Bots' commands with Landlock instead. No extra privileges.
