# 打包配置照 DS Bot app/electron-builder.yml（Apache-2.0）写，它又沿用 DeepSeek Harness Desktop 的
# electron-builder 方案：Electron 自带 Node 跑 DSH，不需要用户装 Node。见 NOTICE。
appId: io.github.molimochou.dshbot
productName: DSH Bot
copyright: Copyright 2026 凯 章
artifactName: DSH-Bot-${version}-${os}-${arch}.${ext}
directories:
  output: dist-pack
files:
  - package.json
  - desktop/**
  - host/host.mjs
  - engine/**
  - dist/**
  - assets/**
  - LICENSE
  - NOTICE
# node-pty、sharp、koffi 等原生模块带各平台预编译包；重编译要 C++ 工具链，所以和 DS Bot 一样不重编译，
# 并在 beforePack 里拦住跨架构打包。
npmRebuild: false
beforePack: ./scripts/before-pack.mjs
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  installerLanguages: [zh_CN, en_US]
  multiLanguageInstaller: true
  artifactName: DSH-Bot-${version}-win-${arch}-setup.${ext}
portable:
  artifactName: DSH-Bot-${version}-win-${arch}-portable.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: assets/icon.png
  category: Utility
mac:
  target: zip
  identity: '-'
  hardenedRuntime: false
  icon: assets/icon.png
  category: public.app-category.productivity
publish: null
