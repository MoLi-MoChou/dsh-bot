# dsh-bot 的引擎层：位于 dsh-base 之上，不加载 DSH Web 前端。
# 行的写法参照 DS Bot app/engine/cordis.patch.yml（Apache-2.0）与 @deepseek-ai/dsh-web-app（MIT），见 NOTICE。

- id: system-prompt
  config:
    personaPrefix: !!js "process.env.DSH_BOT_PERSONA ?? 'You are DSH Bot, a personal assistant bot.'"

- id: agent-default-model
  config:
    provider: !!js "process.env.DSH_BOT_PROVIDER ?? 'mock'"
    model: !!js "process.env.DSH_BOT_MODEL ?? 'mock-chat'"

- id: llm-pi-ai
  config:
    providers:
      mock:
        displayName: Mock (spike)
        api: openai-completions
        baseURL: !!js "process.env.MOCK_BASE_URL ?? 'http://127.0.0.1:4010/v1'"
        apiKeyEnv: MOCK_API_KEY
        compat:
          thinkingFormat: deepseek
        models:
          - id: mock-chat
            name: Mock Chat
            contextWindow: 128000
            reasoningEfforts:
              off:
              high: high

- insert:
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []
    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
    - id: bot-host
      name: dsh-bot-engine
      config:
        port: !!js "Number(process.env.DSH_BOT_PORT ?? 8787)"
